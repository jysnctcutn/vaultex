name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # gitleaks (below) always runs regardless of what changed -- a secret can
  # leak in any file type, not just dependency manifests. pip-audit only
  # cares about requirements*.txt, so it's the one job worth skipping when
  # those files didn't change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      requirements: ${{ steps.filter.outputs.requirements }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            requirements:
              - 'requirements.txt'
              - 'requirements-dev.txt'

  pip-audit:
    needs: changes
    if: needs.changes.outputs.requirements == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
