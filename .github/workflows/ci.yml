name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # torch is a transitive dep of sentence-transformers; on Linux pip
      # defaults to the CUDA build. Same CPU-only pin as the Dockerfile.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
